name: 行政・社会・議会・世界の動きの収集

on:
  schedule:
    - cron: "17 21 * * *"   # 毎朝 6:17（日本時間）
  workflow_dispatch:         # Actions 画面から手動実行

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 行政・社会・議会・世界の動きを収集
        run: python3 tools/news.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動更新: $(TZ=Asia/Tokyo date +%Y-%m-%d) 行政・社会の動き"
            git push
          fi
